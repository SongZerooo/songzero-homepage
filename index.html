<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人主页</title>
  <meta name="description" content="个人主页">
  <meta name="keywords" content="个人主页, 学术主页, 研究者, 学生, 个人网站">
  <meta name="theme-color" content="#f3f5f8">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css" integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/a860a211d3.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/font_sans_serif.css">
  <link rel="stylesheet" href="assets/css/theme-szero.css">
</head>
<body class="theme-szero">
  <nav class="top-nav">
    <div class="nav-container">
      <div class="nav-left"><a href="./">Home</a></div>
      <div class="nav-right">
        <a id="resumeGeneratorToggle" class="resume-generator-trigger" href="resume-generator.html" title="打开简历生成器"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i><span>生成简历</span></a>
        <button id="languageToggle" class="theme-toggle" title="切换到英文" aria-label="切换到英文">EN</button>
        <button id="themeToggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </nav>
  <div class="wrapper" id="homepageRoot"></div>
  <script src="assets/js/scale.fix.js"></script>
  <script src="assets/js/profile.js"></script>
  <script src="assets/js/homepage-renderer.js"></script>
  <script>
    (function() {
      var root = document.getElementById('homepageRoot');
      var languageToggle = document.getElementById('languageToggle');
      var themeToggle = document.getElementById('themeToggle');
      var icon = themeToggle.querySelector('i');
      var profile;
      var language = localStorage.getItem('language') === 'en' ? 'en' : 'zh';

      function setTheme(isDark) {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        icon.classList.toggle('fa-sun', isDark);
        icon.classList.toggle('fa-moon', !isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }

      function bindPageActions() {
        var avatar = root.querySelector('.avatar');
        var backToTop = root.querySelector('#backToTop');
        var clicks = 0;
        var timer;
        avatar.setAttribute('role', 'button');
        avatar.setAttribute('tabindex', '0');
        avatar.setAttribute('title', language === 'en' ? 'Click three times to open editor' : '连续点击三次进入编辑页面');
        avatar.onclick = function() {
          clicks += 1;
          if (clicks === 3) { window.location.href = 'editor.html'; return; }
          clearTimeout(timer);
          timer = setTimeout(function() { clicks = 0; }, 500);
        };
        avatar.onkeydown = function(event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); avatar.click(); } };
        window.onscroll = function() { backToTop.classList.toggle('is-visible', window.scrollY > 160); };
        backToTop.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
        if ('IntersectionObserver' in window) {
          var observer = new IntersectionObserver(function(entries) { entries.forEach(function(entry) { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } }); }, { threshold: 0.1 });
          root.querySelectorAll('.section').forEach(function(section) { observer.observe(section); });
        } else root.querySelectorAll('.section').forEach(function(section) { section.classList.add('visible'); });
      }

      function render() {
        root.innerHTML = window.SongZeroHomepage.render(profile, language);
        document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
        document.title = language === 'en' ? 'Song Zerong - Homepage' : profile.basic.name + ' - Homepage';
        languageToggle.textContent = language === 'en' ? '中' : 'EN';
        languageToggle.title = language === 'en' ? 'Switch to Chinese' : '切换到英文';
        languageToggle.setAttribute('aria-label', languageToggle.title);
        bindPageActions();
      }

      languageToggle.onclick = function() { language = language === 'en' ? 'zh' : 'en'; localStorage.setItem('language', language); render(); };
      themeToggle.onclick = function() { setTheme(document.documentElement.getAttribute('data-theme') !== 'dark'); };
      setTheme(localStorage.getItem('theme') ? localStorage.getItem('theme') === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
      window.SongZeroProfile.load().then(function(data) { profile = data; render(); }).catch(function(error) { console.error(error); root.textContent = '无法读取 profile.json'; });
    })();
  </script>
</body>
</html>
