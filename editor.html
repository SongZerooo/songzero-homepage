<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编辑个人主页 - 宋泽荣</title>
  <link rel="stylesheet" href="assets/css/font_sans_serif.css">
  <link rel="stylesheet" href="assets/css/theme-szero.css">
  <style>
    :root { color: #162a46; font-family: "Inter", "Microsoft YaHei", sans-serif; background: #edf1f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .editor-bar { position: sticky; top: 0; z-index: 2000; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; background: #162a46; color: #fff; box-shadow: 0 2px 10px rgba(22, 42, 70, .2); }
    .editor-title { margin: 0; font-size: 20px; }
    .editor-help { margin: 3px 0 0; color: #cdd9e7; font-size: 13px; }
    .editor-actions { display: flex; gap: 8px; }
    .editor-actions button, .editor-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border: 1px solid #fff; border-radius: 6px; background: #fff; color: #162a46 !important; cursor: pointer; font: inherit; font-size: 14px; text-decoration: none; }
    .editor-actions button:hover, .editor-actions a:hover { background: #dce7f2; color: #162a46 !important; filter: none !important; }
    .editor-status { min-height: 20px; margin: 12px auto -4px; width: min(1120px, calc(100% - 32px)); color: #356047; font-size: 14px; }
    .editor-status.error { color: #a23d3d; }
    .save-modal[hidden] { display: none; }
    .save-modal { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 20px; background: rgba(12, 25, 43, .42); }
    .save-modal-card { width: min(420px, 100%); padding: 26px; border: 1px solid #d7dde6; border-radius: 10px; background: #fff; color: #162a46; box-shadow: 0 12px 36px rgba(22, 42, 70, .24); text-align: center; }
    .save-modal-card h2 { margin: 0 0 10px; font-size: 21px; }
    .save-modal-card p { margin: 0 0 20px; color: #526176; font-size: 14px; }
    .save-modal-card button { min-height: 40px; padding: 0 18px; border: 1px solid #162a46; border-radius: 6px; background: #162a46; color: #fff; cursor: pointer; font: inherit; font-size: 14px; }
    .save-modal-card button:hover { background: #294466; }
    #editorSurface { width: min(1120px, 100%); min-height: calc(100vh - 110px); margin: 0 auto; padding: 1px 0 40px; outline: 3px solid transparent; }
    #editorSurface .section { opacity: 1; transform: none; }
    #editorSurface .editor-add-control { position: relative; z-index: 10; display: flex; justify-content: center; margin: 18px 0 4px; pointer-events: auto; }
    #editorSurface .editor-add-control button { position: relative; z-index: 11; min-height: 34px; padding: 0 14px; border: 1px dashed #59708e; border-radius: 6px; background: transparent; color: #162a46; cursor: pointer; font: inherit; font-size: 14px; pointer-events: auto; }
    #editorSurface .editor-add-control button:hover { background: #dce7f2; }
    #editorSurface .editor-delete-control { position: relative; z-index: 10; display: inline-flex; margin: 6px 0 0 8px; pointer-events: auto; vertical-align: middle; }
    #editorSurface .editor-delete-control button { min-height: 26px; padding: 0 9px; border: 1px solid #b45b5b; border-radius: 5px; background: transparent; color: #a23d3d; cursor: pointer; font: inherit; font-size: 12px; pointer-events: auto; }
    #editorSurface .editor-delete-control button:hover { background: #fbe8e8; }
    #editorSurface .editor-drag-handle { position: absolute; top: 8px; right: 8px; z-index: 100; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 26px; padding: 0 9px; border: 1px dashed #59708e; border-radius: 5px; background: transparent; color: #59708e; cursor: grab; font: inherit; font-size: 12px; user-select: none; pointer-events: auto; touch-action: none; }
    #editorSurface .editor-drag-handle[contenteditable="false"] { pointer-events: auto; }
    #editorSurface .editor-drag-handle:active { cursor: grabbing; }
    #editorSurface .timeline-item { position: relative; }
    #editorSurface .editor-new-section { margin-top: 24px; padding-top: 22px; border-top: 2px dashed #9aabc0; }
    #editorSurface:focus-within { outline-color: rgba(22, 42, 70, .12); }
    #editorSurface [contenteditable="false"] { pointer-events: none; }
    #editorSurface a { cursor: text; }
    @media (max-width: 700px) {
      .editor-bar { align-items: flex-start; flex-direction: column; padding: 12px 16px; }
      .editor-actions { width: 100%; }
      .editor-actions button, .editor-actions a { flex: 1; text-align: center; }
      #editorSurface { width: 100%; }
    }
  </style>
</head>
<body class="theme-szero">
  <header class="editor-bar">
    <div>
      <h1 class="editor-title">编辑个人主页</h1>
      <p class="editor-help">点击页面中的文字直接修改，保存后下载更新后的 profile.json。</p>
    </div>
    <div class="editor-actions">
      <button class="primary" type="button" id="saveButton">保存修改</button>
      <button type="button" id="resetButton">恢复默认</button>
      <a href="index.html">返回主页</a>
    </div>
  </header>
  <p class="editor-status" id="editorStatus" role="status"></p>
  <div class="save-modal" id="saveModal" hidden role="dialog" aria-modal="true" aria-labelledby="saveModalTitle">
    <div class="save-modal-card">
      <h2 id="saveModalTitle">profile.json 已生成</h2>
      <p>请用下载的文件替换项目根目录中的 profile.json。</p>
      <button type="button" id="closeSaveModal">知道了</button>
    </div>
  </div>
  <main id="editorSurface" contenteditable="true" spellcheck="true" aria-label="个人主页编辑区域"></main>

  <script src="assets/js/profile.js"></script>
  <script src="assets/js/homepage-renderer.js"></script>
  <script>
    (function() {
      var surface = document.getElementById('editorSurface');
      var status = document.getElementById('editorStatus');
      var saveModal = document.getElementById('saveModal');
      var profile;
      var dragState = null;

      function showStatus(message, isError) {
        status.textContent = message;
        status.classList.toggle('error', Boolean(isError));
      }

      function showSaveModal() {
        saveModal.hidden = false;
        document.getElementById('closeSaveModal').focus();
      }

      function addControl(label, handler, className) {
        var wrapper = document.createElement('div');
        var button = document.createElement('button');
        wrapper.className = className || 'editor-add-control';
        wrapper.setAttribute('contenteditable', 'false');
        button.type = 'button';
        button.textContent = '+ ' + label;
        button.addEventListener('click', function(event) {
          event.preventDefault();
          event.stopPropagation();
          handler();
        });
        wrapper.appendChild(button);
        return wrapper;
      }

      function addDeleteControl(target, label) {
        var control = addControl('删除', function() {
          target.remove();
          showStatus('已删除' + (label || '条目') + '。点击“保存修改”后生效。', false);
        }, 'editor-delete-control');
        control.querySelector('button').textContent = '删除';
        target.appendChild(control);
      }

      function addDragHandle(entry) {
        if (entry.querySelector('.editor-drag-handle')) return;
        var handle = document.createElement('span');
        handle.className = 'editor-drag-handle';
        handle.setAttribute('contenteditable', 'false');
        handle.setAttribute('draggable', 'false');
        handle.setAttribute('title', '拖动调整条目顺序');
        handle.textContent = '拖动';
        handle.addEventListener('pointerdown', function(event) {
          if (event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();
          dragState = { entry: entry, moved: false };
          entry.classList.add('editor-dragging');
        });
        entry.appendChild(handle);
      }

      document.addEventListener('pointermove', function(event) {
        if (!dragState) return;
        if (Math.abs(event.movementX) + Math.abs(event.movementY) > 0) dragState.moved = true;
        if (!dragState.moved) return;
        event.preventDefault();
        var target = document.elementFromPoint(event.clientX, event.clientY);
        target = target && target.closest ? target.closest('.timeline-item') : null;
        surface.querySelectorAll('.editor-drop-target').forEach(function(item) { item.classList.remove('editor-drop-target'); });
        if (target && target.parentElement === dragState.entry.parentElement && target !== dragState.entry) target.classList.add('editor-drop-target');
      });

      document.addEventListener('pointerup', function(event) {
        if (!dragState) return;
        var state = dragState;
        var target = document.elementFromPoint(event.clientX, event.clientY);
        target = target && target.closest ? target.closest('.timeline-item') : null;
        if (state.moved && target && target.parentElement === state.entry.parentElement && target !== state.entry) {
          var targetBox = target.getBoundingClientRect();
          state.entry.parentElement.insertBefore(state.entry, event.clientY < targetBox.top + targetBox.height / 2 ? target : target.nextSibling);
          showStatus('条目顺序已调整，点击“保存修改”后生效。', false);
        }
        state.entry.classList.remove('editor-dragging');
        surface.querySelectorAll('.editor-drop-target').forEach(function(item) { item.classList.remove('editor-drop-target'); });
        dragState = null;
      });

      function enableSectionReordering(section) {
        var body = section.querySelector('.section-body');
        if (!body || body.dataset.reorderReady) return;
        body.dataset.reorderReady = 'true';
        body.addEventListener('dragover', function(event) {
          var dragging = body.querySelector('.editor-dragging');
          var target = event.target.closest ? event.target.closest('.timeline-item') : null;
          if (!dragging || !target || target.parentElement !== body || target === dragging) return;
          event.preventDefault();
          target.classList.add('editor-drop-target');
          event.dataTransfer.dropEffect = 'move';
        });
        body.addEventListener('dragleave', function(event) {
          var target = event.target.closest ? event.target.closest('.timeline-item') : null;
          if (target) target.classList.remove('editor-drop-target');
        });
        body.addEventListener('drop', function(event) {
          var dragging = body.querySelector('.editor-dragging');
          var target = event.target.closest ? event.target.closest('.timeline-item') : null;
          if (!dragging || !target || target.parentElement !== body || target === dragging) return;
          event.preventDefault();
          var targetBox = target.getBoundingClientRect();
          var insertBefore = event.clientY < targetBox.top + targetBox.height / 2;
          body.insertBefore(dragging, insertBefore ? target : target.nextSibling);
          target.classList.remove('editor-drop-target');
          showStatus('条目顺序已调整，点击“保存修改”后生效。', false);
        });
      }

      function clearEntry(entry, isEducation) {
        var title = entry.querySelector('.exp-title strong');
        if (title) title.textContent = '新条目';
        var metaSpans = entry.querySelectorAll('.exp-meta span');
        if (metaSpans.length) {
          metaSpans[0].textContent = '补充信息';
          if (metaSpans[1]) metaSpans[1].textContent = '时间';
        } else {
          var meta = entry.querySelector('.exp-meta');
          if (meta) meta.textContent = '时间';
        }
        entry.querySelectorAll('.experience-steps li').forEach(function(item) { item.textContent = '请填写条目内容'; });
        entry.querySelectorAll('.edu-item').forEach(function(item, index) { item.textContent = ['学历：请填写', '专业：请填写', '研究方向：请填写', 'GPA：请填写', '排名：请填写', '所在地：请填写'][index] || '请填写'; });
        if (!entry.querySelector('.experience-steps') && !entry.querySelector('.edu-detail-grid') && !entry.querySelector('.award-group')) {
          var content = entry.querySelector('.experience-content');
          var list = document.createElement('ul');
          list.className = 'experience-steps';
          list.innerHTML = '<li>请填写条目内容</li>';
          content.appendChild(list);
        }
        return entry;
      }

      function createEntry(section) {
        var existing = section.querySelector('.timeline-item');
        if (!existing) return null;
        var entry = existing.cloneNode(true);
        entry.querySelectorAll('.editor-add-control, .editor-delete-control').forEach(function(control) { control.remove(); });
        entry.querySelectorAll('img').forEach(function(image) { image.remove(); });
        if (section.id === 'awards') {
          entry.querySelectorAll('.award-group .exp-meta').forEach(function(meta, index) {
            var spans = meta.querySelectorAll('span');
            if (spans[0]) spans[0].textContent = '新奖项';
            if (spans[1]) spans[1].textContent = '时间 级别';
            if (index > 0) meta.remove();
          });
        } else {
          clearEntry(entry, section.id === 'education');
        }
        return entry;
      }

      function addSectionEntry(section) {
        var entry = createEntry(section);
        if (!entry) return;
        addDragHandle(entry);
        addDeleteControl(entry, '条目');
        section.querySelector('.section-body').insertBefore(entry, section.querySelector('.editor-add-control'));
        showStatus('已新增条目，请直接编辑其中的文字。', false);
      }

      function addNewSection() {
        var content = surface.querySelector('.content');
        var section = document.createElement('div');
        var sectionBody = document.createElement('div');
        var card = document.createElement('div');
        section.className = 'section editor-new-section';
        section.id = 'custom-section-' + Date.now();
        section.innerHTML = '<h2 class="section-title">新章节</h2>';
        sectionBody.className = 'section-body';
        card.className = 'card timeline-item';
        card.innerHTML = '<div class="experience-item"><div class="experience-content"><p class="exp-title"><strong>新条目</strong></p><p class="exp-meta"><span>补充信息</span><span>时间</span></p><ul class="experience-steps"><li>请填写条目内容</li></ul></div></div>';
        addDragHandle(card);
        addDeleteControl(card, '条目');
        sectionBody.appendChild(card);
        section.appendChild(sectionBody);
        sectionBody.appendChild(addControl('新增条目', function() { addSectionEntry(section); }));
        enableSectionReordering(section);
        var newSectionControl = Array.prototype.find.call(content.children, function(child) { return child.classList.contains('editor-add-control'); });
        content.insertBefore(section, newSectionControl || null);
        showStatus('已新增章节，请编辑章节标题和条目内容。', false);
        section.querySelector('.section-title').focus();
      }

      function addSidebarControls() {
        var profileCard = surface.querySelector('.profile-card');
        var meta = surface.querySelector('.profile-meta');
        var skills = surface.querySelector('.skill-card');
        if (meta) meta.appendChild(addControl('新增个人信息', function() {
          var row = meta.querySelector('.meta-row').cloneNode(true);
          row.querySelector('.meta-label').textContent = '新信息';
          row.querySelector('.meta-value').textContent = '请填写';
          addDeleteControl(row, '个人信息');
          meta.insertBefore(row, meta.querySelector('.editor-add-control'));
          showStatus('已新增个人信息，请直接编辑。', false);
        }));
        if (skills) skills.appendChild(addControl('新增技能', function() {
          var row = skills.querySelector('.skill-row').cloneNode(true);
          row.querySelector('.skill-name').textContent = '新技能';
          row.querySelector('.skill-level').textContent = '熟练程度';
          addDeleteControl(row, '技能');
          skills.querySelector('.skill-list').appendChild(row);
          showStatus('已新增技能，请直接编辑。', false);
        }));
      }

      function addEditorControls() {
        surface.querySelectorAll('.editor-add-control, .editor-delete-control').forEach(function(control) { control.remove(); });
        addSidebarControls();
        surface.querySelectorAll('.meta-row').forEach(function(row) { addDeleteControl(row, '个人信息'); });
        surface.querySelectorAll('.skill-row').forEach(function(row) { addDeleteControl(row, '技能'); });
        surface.querySelectorAll('.content > .section').forEach(function(section) {
          var body = section.querySelector('.section-body');
          if (body) {
            section.querySelectorAll('.timeline-item').forEach(function(entry) { addDragHandle(entry); addDeleteControl(entry, '条目'); });
            enableSectionReordering(section);
            body.appendChild(addControl('新增条目', function() { addSectionEntry(section); }));
          }
        });
        var content = surface.querySelector('.content');
        if (content) content.appendChild(addControl('新增章节', addNewSection));
      }

      function readEntry(item, source) {
        var details = Array.prototype.map.call(item.querySelectorAll('.edu-item'), function(detail) { return detail.textContent.trim(); });
        var tags = Array.prototype.map.call(item.querySelectorAll('.exp-meta > span'), function(tag) { return tag.textContent.trim(); });
        if (source.type === 'awards') {
          return { title: item.querySelector('.exp-title') ? item.querySelector('.exp-title').textContent.trim() : '', awards: Array.prototype.map.call(item.querySelectorAll('.award-group .exp-meta'), function(award) { return Array.prototype.map.call(award.querySelectorAll('span'), function(part) { return part.textContent.trim(); }); }) };
        }
        var entry = { title: item.querySelector('.exp-title') ? item.querySelector('.exp-title').textContent.trim() : '', tags: tags, details: details, bullets: Array.prototype.map.call(item.querySelectorAll('.experience-steps li'), function(bullet) { return bullet.textContent.trim(); }) };
        var logo = item.querySelector('.institution-logo');
        if (logo) entry.institutionLogo = logo.getAttribute('src');
        return entry;
      }

      function versionItems(value, version) {
        if (Array.isArray(value)) return value.map(function(item) { return typeof item === 'string' ? item : item[version] || item.a || ''; });
        return value && (value[version] || value.a) || [];
      }

      function serializableProfile() {
        var next = JSON.parse(JSON.stringify(profile));
        var basic = next.basic;
        basic.name = surface.querySelector('.site-name') ? surface.querySelector('.site-name').textContent.trim() : basic.name;
        basic.alias = surface.querySelector('.site-name-sub') ? surface.querySelector('.site-name-sub').textContent.trim() : basic.alias;
        var values = {};
        surface.querySelectorAll('.meta-row').forEach(function(row) { values[row.querySelector('.meta-label').textContent.trim()] = row.querySelector('.meta-value').textContent.trim(); });
        basic.email = values['邮箱'] || basic.email; basic.phone = values['手机号'] || basic.phone; basic.wechat = values['微信号'] || basic.wechat; basic.ethnicity = values['民族'] || basic.ethnicity; basic.politicalStatus = values['政治面貌'] || basic.politicalStatus; basic.mbti = values['MBTI'] || basic.mbti; basic.interests = values['爱好'] || basic.interests;
        next.about.intro = surface.querySelector('.about-intro') ? surface.querySelector('.about-intro').textContent.trim() : next.about.intro;
        var aboutDetails = Array.prototype.map.call(surface.querySelectorAll('.about-detail'), function(detail) { return detail.textContent.trim(); });
        next.about.details = { a: aboutDetails, b: (profile.about.details.b || aboutDetails).slice(), c: (profile.about.details.c || aboutDetails).slice() };
        next.skills = Array.prototype.map.call(surface.querySelectorAll('.skill-row'), function(row) { return { name: row.querySelector('.skill-name').textContent.trim(), level: row.querySelector('.skill-level').textContent.trim() }; });
        next.sections = Array.prototype.map.call(surface.querySelectorAll('.content > .section'), function(section) {
          var source = next.sections.find(function(item) { return item.id === section.id; }) || { id: section.id, type: 'experience', entries: [] };
          var originalEntries = source.entries || [];
          source.title = section.querySelector('.section-title').textContent.trim();
          source.entries = Array.prototype.map.call(section.querySelectorAll('.timeline-item'), function(item, index) {
            var original = originalEntries[index] || {};
            var nextEntry = readEntry(item, source);
            if (source.type !== 'awards') {
              var originalBullets = original.bullets || {};
              nextEntry.bullets = { a: nextEntry.bullets, b: originalBullets.b || nextEntry.bullets, c: originalBullets.c || nextEntry.bullets };
            }
            return nextEntry;
          });
          return source;
        });
        next.meta.updatedAt = new Date().toISOString().slice(0, 10);
        return next;
      }

      function downloadProfile() {
        var blob = new Blob([JSON.stringify(serializableProfile(), null, 2)], { type: 'application/json;charset=utf-8' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'profile.json';
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function loadHomepage() {
        return SongZeroProfile.load().then(function(data) {
          profile = data;
          surface.innerHTML = window.SongZeroHomepage.render(profile, 'zh');
          addEditorControls();
          surface.querySelectorAll('a').forEach(function(link) { link.addEventListener('click', function(event) { event.preventDefault(); }); });
        }).catch(function() {
          showStatus('无法读取主页，请通过本地服务器打开编辑页面。', true);
        });
      }

      document.getElementById('saveButton').addEventListener('click', function() {
        downloadProfile();
        showStatus('已下载新的 profile.json，请用它替换项目根目录中的同名文件。', false);
        showSaveModal();
      });

      document.getElementById('closeSaveModal').addEventListener('click', function() {
        saveModal.hidden = true;
      });

      document.getElementById('resetButton').addEventListener('click', function() {
        if (!window.confirm('确定放弃当前编辑内容并重新读取 profile.json 吗？')) return;
        loadHomepage().then(function() { showStatus('已重新读取 profile.json，尚未保存。', false); });
      });

      loadHomepage();
    })();
  </script>
</body>
</html>
